services:
  nginx:
    build:
      target: final
    volumes:
      - storage_data:/var/www/html/storage/public:ro

  php:
    build:
      target: final
    volumes:
      - storage_data:/var/www/html/storage/public
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 5s
      timeout: 3s
      retries: 3

  preact:
    build:
      target: final
