map $http_x_forwarded_port $resolved_port {
    "" $server_port;
    default $http_x_forwarded_port;
}

map $http_x_forwarded_proto $resolved_scheme {
    "" $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 9001;
    server_name localhost;
    index index.php;
    client_max_body_size 10M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    brotli on;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    brotli_min_length 256;
    brotli_comp_level 6;
    brotli_static on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;

    location /admin {
        proxy_pass http://app-php:9000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $resolved_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Port $resolved_port;
    }

    location / {
        proxy_pass http://app-web:9002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
