[routes]
GET @dashboard: /admin = Http\Controllers\Admin\DashboardController->index
GET @login: /admin/login = Http\Controllers\Auth\AuthSessionController->index
POST @login_store: /admin/login = Http\Controllers\Auth\AuthSessionController->store
DELETE @logout: /admin/logout = Http\Controllers\Auth\AuthSessionController->destroy

GET @admin_cards_index: /admin/cards = Http\Controllers\Admin\CardController->index
GET @admin_cards_create: /admin/cards/create = Http\Controllers\Admin\CardController->create
GET @admin_cards_edit: /admin/cards/@id/edit = Http\Controllers\Admin\CardController->edit
GET @admin_cards_show: /admin/cards/@id = Http\Controllers\Admin\CardController->show
POST @admin_cards_store: /admin/cards/@id = Http\Controllers\Admin\CardController->store
PUT @admin_cards_update: /admin/cards/@id = Http\Controllers\Admin\CardController->update
DELETE @admin_cards_destroy: /admin/cards/@id = Http\Controllers\Admin\CardController->destroy

GET @admin_news_index: /admin/news = Http\Controllers\Admin\NewsController->index
GET @admin_news_create: /admin/news/create = Http\Controllers\Admin\NewsController->create
GET @admin_news_edit: /admin/news/@id/edit = Http\Controllers\Admin\NewsController->edit
GET @admin_news_show: /admin/news/@id = Http\Controllers\Admin\NewsController->show
POST @admin_news_store: /admin/news/@id = Http\Controllers\Admin\NewsController->store
PUT @admin_news_update: /admin/news/@id = Http\Controllers\Admin\NewsController->update
DELETE @admin_news_destroy: /admin/news/@id = Http\Controllers\Admin\NewsController->destroy

DELETE @admin_images_destroy: /admin/images/@id = Http\Controllers\Admin\ImageController->destroy
PUT @admin_images_update: /admin/images/@id = Http\Controllers\Admin\ImageController->update

GET @profile: /admin/settings/profile = Http\Controllers\Admin\ProfileController->index
POST @profile_update: /admin/profile = Http\Controllers\Admin\ProfileController->update

GET @appearance: /admin/settings/appearance = Http\Controllers\Admin\AppearanceController->index
GET @locale: /admin/settings/locale = Http\Controllers\Admin\LocaleController->index
POST @locale_update: /admin/locale = Http\Controllers\Admin\LocaleController->update
GET @password: /admin/settings/password = Http\Controllers\Admin\UpdatePasswordController->index
POST @password_update: /admin/password = Http\Controllers\Admin\UpdatePasswordController->update

GET /@action [cli] = Http\Controllers\CliController->@action
